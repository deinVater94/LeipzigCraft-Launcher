name: Build LeipzigCraft Launcher

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "LeipzigCraft.Launcher.csproj"
      - "**/*.cs"
      - "**/*.xaml"
      - "Assets/**"
      - ".github/workflows/build-launcher.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore LeipzigCraft.Launcher.csproj

      - name: Publish single EXE
        run: >
          dotnet publish LeipzigCraft.Launcher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeipzigCraft-Launcher-win-x64
          path: publish/LeipzigCraft-Launcher.exe
